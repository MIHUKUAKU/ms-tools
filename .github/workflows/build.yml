name: Build Fabric 26.2 and 26.3
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: '26.2'
            loader: '0.19.3'
            api: '0.153.0+26.2'
            cycling: 'Pw2HCuRa'
            traders: '2.5.0'
          - mc: '26.3'
            loader: '0.19.5'
            api: '0.162.0+26.3'
            cycling: 'FKbMeHEw'
            traders: '2.5.1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Prepare Gradle wrapper
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
      - name: Compile both mods and run filter assertions
        run: ./gradlew build -Pminecraft_version=${{ matrix.mc }} -Ploader_version=${{ matrix.loader }} -Pfabric_api_version=${{ matrix.api }} -Ptrade_cycling_version=${{ matrix.cycling }} -Pvisible_traders_version=${{ matrix.traders }} --console=plain
